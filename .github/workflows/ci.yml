name: CI — Quality Gates

# `push` é restrito a `main`: com `branches: ['**']`, todo push numa branch com PR
# aberto disparava DUAS execuções para o mesmo commit (push + pull_request), cada
# uma com um grafo de jobs diferente — o E2E só roda condicionado a
# `github.ref == main || event_name == pull_request` (ver job `e2e` abaixo), então
# a run de `push` sempre pulava E2E e fechava "Quality Gate ✅", enquanto a run de
# `pull_request` rodava E2E de verdade e podia fechar "❌" — os dois resultados
# ficavam lado a lado na aba Checks para o mesmo SHA, parecendo não-determinismo.
# `pull_request` já cobre toda validação pré-merge; `push` em `main` cobre o
# pós-merge. Nenhuma cobertura é perdida, e o custo de CI cai pela metade.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────
# Gate 1: Lint + type-check
# ──────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Guard against stray build artifacts under Edge Functions
        # Deno deploys ship the whole supabase/functions/ tree. A graph-tool
        # output directory has previously leaked into _shared/ from a direct
        # (non-npm-wrapped) invocation of the Python tooling — .gitignore hides
        # it locally but does not stop it from bloating a deploy if it exists
        # on the runner. Fail loudly instead of deploying it silently.
        run: |
          set -euo pipefail
          matches="$(find supabase/functions -type d \( -name 'graphify-out' -o -name '.graphify-cache' -o -name '.graphify_cache' -o -name '.venv-graphify' \))"
          if [ -n "$matches" ]; then
            echo "::error::Build/tooling artifacts found under supabase/functions/ (would be deployed as Edge Function code):"
            echo "$matches"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund

      - name: Run ESLint
        run: npm run lint -- --max-warnings 9999

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Any Ratchet — impedir regressão de 'any'
        run: npm run quality:any

# ──────────────────────────────────────────────────────────────────────────
# Gate 2: Security scan (runs in parallel with lint)
# ──────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # TruffleHog compara base/head; clone raso conclui sem commits
          # comparáveis e pode mascarar achados.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund

      - name: Dependency vulnerability audit (allowlist documentada)
        # Gate forte + exceções explícitas: advisories não-aplicáveis ao contexto
        # (ex.: SSR-only em SPA Vite) vivem no ALLOWED_PACKAGES com justificativa
        # e plano de remoção — ver scripts/audit-gate.mjs.
        run: node scripts/audit-gate.mjs

      - name: Secret scanning (TruffleHog)
        # Pinned to v3 tag for supply-chain safety. Update periodically.
        uses: trufflesecurity/trufflehog@1aa1871f9ae24a8c8a3a48a9345514acf42beb39 # v3.82.13
        with:
          path: ./
          base: ${{ github.event.before || 'HEAD~1' }}
          head: HEAD
          # Removed --only-verified: unverifiable secrets (expired keys, private
          # endpoints like Bitrix24) would otherwise be silently ignored.

      - name: CORS wildcard regression guard
        # Certificação (não correção): CORS de produção já é centralizado em
        # supabase/functions/_shared/cors.ts com allowlist (pickAllowedOrigin),
        # nunca "*". Este guard falha se um wildcard aparecer fora de *.test.ts
        # — o único lugar onde "*" deve aparecer é em uma asserção que prova
        # que o header NUNCA é "*" (ver cors.test.ts).
        run: |
          set -euo pipefail
          matches="$(grep -rlE "Access-Control-Allow-Origin[\"'\`]?[[:space:]]*[:=,(][[:space:]]*[\"'\`]\*" \
            supabase/functions/ src/ 2>/dev/null | grep -v '\.test\.ts$' || true)"
          if [ -n "$matches" ]; then
            echo "::error::Access-Control-Allow-Origin: '*' encontrado fora de *.test.ts — CORS de produção deve usar _shared/cors.ts (pickAllowedOrigin):"
            echo "$matches"
            exit 1
          fi

# ──────────────────────────────────────────────────────────────────────────
# Gate 3: Unit tests + coverage (blocks deploy if < thresholds)
# ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --reporter=verbose --reporter=json --outputFile=test-results.json

      - name: Enforce coverage thresholds
        run: |
          echo "Coverage thresholds enforced: lines≥15%, functions≥10%, branches≥10%, statements≥15%"
          echo "vitest enforces thresholds — if this step ran, thresholds passed."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: |
            test-results.json
            coverage/
          retention-days: 14

      - name: Upload coverage to summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
            npx lcov-summary coverage/lcov.info >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi

# ──────────────────────────────────────────────────────────────────────────
# Gate 3b: Edge Functions (Deno, imports congelados)
# ──────────────────────────────────────────────────────────────────────────
  deno-tests:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The shared Deno modules use npm type declarations (notably @types/node).
      # Install the lockfile-resolved workspace before running with --frozen so
      # the runner has the same type-resolution graph as local validation.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install workspace dependencies for Deno type resolution
        run: npm ci --legacy-peer-deps --no-fund

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.5

      - name: Check Edge Function types with frozen imports
        # 17/09 (Lote 3): as 33 functions + _shared/auth.ts sao type-checkadas.
        # Historico: ja houve SyntaxError (const duplicada) e 29 erros TS
        # escondidos porque este passo cobria apenas 2 arquivos.
        run: |
          FILES="supabase/functions/_shared/auth.ts"
          for d in supabase/functions/*/; do
            [ -f "${d}index.ts" ] || continue
            FILES="$FILES ${d}index.ts"
          done
          deno check --frozen $FILES

      - name: Run shared Edge Function tests with frozen imports
        # --allow-read scoped to _shared/: cors.test.ts dynamically re-imports
        # cors.ts per env-var combination (module-level consts read env once),
        # which needs read access to that one file even though it's a local
        # relative import.
        run: deno test --frozen --allow-env --allow-read=supabase/functions/_shared supabase/functions/_shared/*.test.ts

# ──────────────────────────────────────────────────────────────────────────
# Gate 4: Simulation tests (webhook/ERP/fuzz/load — most comprehensive)
# ──────────────────────────────────────────────────────────────────────────
  simulation-tests:
    name: Simulation & Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund

      - name: Run webhook simulation suite
        run: npx vitest run src/test/webhookSimulation.test.ts --reporter=verbose

      - name: Run fuzz / adversarial tests
        run: npx vitest run src/test/webhookFuzz.test.ts --reporter=verbose

      - name: Run ERP contract tests
        run: npx vitest run src/test/erpApiContracts.test.ts --reporter=verbose

      - name: Run load & stress tests
        run: npx vitest run src/test/loadStress.test.ts --reporter=verbose

      - name: Report test counts to summary
        if: always()
        run: |
          echo "## Simulation Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Webhook scenarios: 500+ valid + negative + fuzz" >> $GITHUB_STEP_SUMMARY
          echo "- ERP contract cases: 400+" >> $GITHUB_STEP_SUMMARY
          echo "- Fuzz payloads: 1000+ random malformed" >> $GITHUB_STEP_SUMMARY
          echo "- Load scenarios: 10k–50k concurrent ops" >> $GITHUB_STEP_SUMMARY

# ──────────────────────────────────────────────────────────────────────────
# Gate 5: Build (requires all test gates to pass)
# ──────────────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [security, unit-tests, deno-tests, simulation-tests]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          # client.ts reads VITE_SUPABASE_PUBLISHABLE_KEY, not _ANON_KEY (see
          # CLAUDE.md's documented naming inconsistency) — the build was
          # silently shipping createClient(url, undefined) without this.
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ALERT_WEBHOOK_URL: ${{ secrets.VITE_ALERT_WEBHOOK_URL }}
        run: npm run build

      - name: Generate bundle report & enforce budgets
        run: npm run bundle:report

      - name: Upload bundle report (HTML + JSON + MD)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-report-${{ github.sha }}
          path: |
            dist/bundle-report.html
            dist/bundle-report.json
            dist/bundle-report.md
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

# ──────────────────────────────────────────────────────────────────────────
# Gate 5b: Bundle diff vs main (PRs only) — comments size changes on PR
# ──────────────────────────────────────────────────────────────────────────
  bundle-diff:
    name: Bundle Diff vs main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download current PR bundle report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundle-report-${{ github.sha }}
          path: bundle-head

      - name: Download latest main bundle report (baseline)
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        continue-on-error: true
        with:
          workflow: ci.yml
          branch: main
          name_is_regexp: true
          name: bundle-report-.*
          path: bundle-base
          if_no_artifact_found: warn

      - name: Generate diff markdown
        run: |
          BASE_JSON=$(find bundle-base -name 'bundle-report.json' | head -n1 || true)
          HEAD_JSON=bundle-head/bundle-report.json
          mkdir -p dist
          node scripts/bundle-diff.mjs "$BASE_JSON" "$HEAD_JSON" dist/bundle-diff.md
          cat dist/bundle-diff.md >> $GITHUB_STEP_SUMMARY

      - name: Comment bundle diff on PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: bundle-diff
          path: dist/bundle-diff.md


# ──────────────────────────────────────────────────────────────────────────
# Gate 6: E2E tests (only on main and PRs targeting main)
# ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-${{ github.sha }}
          path: dist/

      # The E2E suite logs into a LIVE Supabase instance with a seeded test
      # user. Without the Supabase secrets the SPA cannot even boot
      # (createClient throws), so every test fails at the login form — a
      # permanently-red gate that verifies nothing. Run the suite only when
      # the required secrets are configured; surface a loud notice otherwise
      # so the skip is a conscious, visible state rather than silent.
      - name: Check E2E prerequisites
        id: e2e-prereq
        env:
          SUPABASE_URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY_SECRET: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_EMAIL_SECRET: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD_SECRET: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_URL_SECRET" ] && [ -n "$SUPABASE_KEY_SECRET" ] && [ -n "$E2E_EMAIL_SECRET" ] && [ -n "$E2E_PASSWORD_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "## ❌ E2E indisponível — secrets obrigatórios ausentes" >> "$GITHUB_STEP_SUMMARY"
            echo "A suíte requer \`VITE_SUPABASE_URL\`, \`VITE_SUPABASE_PUBLISHABLE_KEY\`, \`E2E_EMAIL\` e \`E2E_PASSWORD\`. O gate falha fechado para não sinalizar qualidade inexistente." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=E2E prerequisites missing::Configure VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, E2E_EMAIL and E2E_PASSWORD."
            exit 1
          fi

      - name: Run E2E tests
        if: steps.e2e-prereq.outputs.enabled == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8090
          # Credentials for the seeded live-instance test user — required;
          # the credentials helper fails fast when they are absent.
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # A conta E2E tem MFA (TOTP) ativo — login() em helpers/e2e-setup.ts
          # usa este secret pra responder o desafio quando ele aparecer.
          E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
        # CI: chromium only + 2 workers to fit within the time budget.
        # mobile-chrome and full parallelism are covered by local dev runs.
        run: npm run test:e2e -- --project=chromium --workers=2 --reporter=html --reporter=list
        # Removed continue-on-error: true to fail the build if E2E tests fail


      - name: Upload Playwright report
        if: always() && steps.e2e-prereq.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

# ──────────────────────────────────────────────────────────────────────────
# Gate 7: Quality gate summary — fails the PR if critical gates failed
# ──────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate ✅
    runs-on: ubuntu-latest
    needs: [lint, security, unit-tests, deno-tests, simulation-tests, build, e2e]
    if: always()
    steps:
      - name: Check all gates
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY

          declare -A gates=(
            ["lint"]="${{ needs.lint.result }}"
            ["security"]="${{ needs.security.result }}"
            ["unit-tests"]="${{ needs.unit-tests.result }}"
            ["deno-tests"]="${{ needs.deno-tests.result }}"
            ["simulation-tests"]="${{ needs.simulation-tests.result }}"
            ["build"]="${{ needs.build.result }}"
            ["e2e"]="${{ needs.e2e.result }}"

          )

          FAILED=0
          for gate in "${!gates[@]}"; do
            status="${gates[$gate]}"
            if [ "$status" = "success" ]; then
              echo "✅ $gate: $status" >> $GITHUB_STEP_SUMMARY
            elif [ "$status" = "skipped" ] || [ "$status" = "cancelled" ]; then
              echo "⏭️ $gate: $status (superseded by newer push)" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $gate: $status" >> $GITHUB_STEP_SUMMARY
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "### ❌ DEPLOY BLOCKED — One or more quality gates failed"
            echo "Fix the failing checks before merging to main."
            exit 1
          fi

          echo ""
          echo "### ✅ All quality gates passed — safe to deploy"
