name: Visual Baselines Generator

# Etapa 39 do plano-50: gera os snapshots de regressao visual NO MESMO
# ambiente do CI (ubuntu-latest + chromium) — paridade de renderizacao
# garantida. O artifact e baixado e commitado por um maintainer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate visual baselines (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Generate baselines (update-snapshots)
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
        run: npx playwright test visual-regression --project=chromium --update-snapshots --workers=1

      - name: Upload baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/e2e/**/*-snapshots/*.png
          retention-days: 7
          if-no-files-found: error
