name: Visual Baselines Generator

# Etapa 39 do plano-50: gera os snapshots de regressao visual NO MESMO
# ambiente do CI (ubuntu-latest + chromium) — paridade de renderizacao
# garantida. O artifact e baixado e commitado por um maintainer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate visual baselines (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Generate baselines (update-snapshots)
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
        run: npx playwright test visual-regression --project=chromium --update-snapshots --workers=1

      - name: Upload baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: tests/e2e/**/*-snapshots/*.png
          retention-days: 7
          if-no-files-found: error
