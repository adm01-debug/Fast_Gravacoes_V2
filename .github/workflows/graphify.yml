name: Architecture graph

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/**'
      - 'scripts/**'
      - '*config*.json'
      - 'graphify-baseline.json'
      - 'docs/graphify/**'
      - 'docs/plano-graphify-50-etapas.md'
      - '.graphifyignore'
      - '.gitignore'
      - '.github/workflows/graphify.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-latest
    # 2 builds (head + base do PR para o diff) dobram o tempo de extração.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # merge-base do PR precisa do histórico para o diff base×head (etapa 42).
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned graph tooling
        run: npm run graph:install
      - name: Exercise graph failure modes
        run: npm run graph:test
      - name: Build structural graph
        run: npm run graph:build
      - name: Diff graph against PR base (etapa 42)
        if: github.event_name == 'pull_request'
        run: |
          set -e
          BASE_SHA=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          echo "Merge-base com ${{ github.base_ref }}: $BASE_SHA"
          git worktree add .graph-base "$BASE_SHA"
          (cd .graph-base && npm run graph:install && npm run graph:build)
          .venv-graphify/bin/python scripts/graphify/run.py diff --baseline .graph-base/graphify-out/graph.json > graphify-out/graph-diff.json
          python3 - <<'PY'
          import json
          d = json.load(open('graphify-out/graph-diff.json'))
          n, e = d['nodes'], d['edges']
          print(f"nodes: +{len(n['added'])} / -{len(n['removed'])} | edges: +{len(e['added'])} / -{len(e['removed'])}")
          PY
      - name: Validate snapshot integrity and freshness
        run: npm run graph:check
      - name: Audit structural controls
        run: npm run graph:audit
      - name: Run reviewed benchmark and non-blocking ratchet
        run: |
          npm run graph:benchmark
          npm run graph:ratchet -- --mode report
      - name: Prove unchanged corpus is a no-op
        run: npm run graph:build
      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -f graphify-out/GRAPH_REPORT.md ]; then
            cat graphify-out/GRAPH_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f graphify-out/graph-diff.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('graphify-out/graph-diff.json'))
          def section(title, items, fmt=lambda x: x, cap=50):
              lines = [f'### {title} ({len(items)})']
              for item in items[:cap]:
                  lines.append(f'- `{fmt(item)}`')
              if len(items) > cap:
                  lines.append(f'- … +{len(items) - cap} mais (ver graph-diff.json)')
              return lines
          n, e = d['nodes'], d['edges']
          out = [f'## Diff estrutural base×head ({d.get("baseline", "?")})', '']
          out += section('Nós adicionados', n['added'])
          out += section('Nós removidos', n['removed'])
          out += section('Relações adicionadas', e['added'], lambda t: ' → '.join(str(p) for p in t))
          out += section('Relações removidas', e['removed'], lambda t: ' → '.join(str(p) for p in t))
          print('\n'.join(out))
          PY
          fi
