# Dependabot — atualizações de dependências AGRUPADAS para não inundar o repositório de PRs.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Dependências do app (npm — o mesmo gerenciador da instalação no deploy/CI)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      producao-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      desenvolvimento:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
          - "major"

  # Ações dos workflows (fixadas por SHA): mensal, num PR só
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      acoes:
        patterns:
          - "*"
