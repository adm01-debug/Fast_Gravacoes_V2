# ─────────────────────────────────────────────────────────────────────────
# Edge Functions — verify_jwt explícito
#
# O default do Supabase (verify_jwt = true) já era o comportamento efetivo de
# todas as 33 functions antes desta seção existir — nenhuma sobrescrita existia
# aqui. Declarar `true` explicitamente para cada uma não muda nada em produção;
# apenas remove a dependência de um default implícito, documentado só no código-
# fonte do CLI, por um valor lido diretamente deste arquivo.
#
# Por que `true` para todas, inclusive as cron/webhook: o gateway aceita
# qualquer JWT válido, não apenas sessão de usuário — cron jobs e webhooks
# aqui chamam com a service-role key ou a anon key (ambas JWTs assinados),
# e têm um segundo fator de aplicação por cima (requireCronSecret, HMAC de
# webhook, ou checagem de papel/AAL2). `verify_jwt = true` é a camada 1
# (rejeita requisição sem JWT algum antes do código da function rodar);
# o segundo fator é a camada 2. Isso é defesa em profundidade, não
# redundância — trocar para `false` REMOVERIA a camada 1 e aumentaria a
# superfície exposta a tráfego não autenticado. Ver classificação completa
# por function em supabase/functions/README.md. Qualquer mudança futura
# para `false` é alteração real de gateway e exige validação contra o
# projeto canônico antes de aplicar — nunca só por leitura de código.
# ─────────────────────────────────────────────────────────────────────────
[functions.approve-password-reset]
verify_jwt = true

